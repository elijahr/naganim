[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "naganim"
version = "0.1.0"
description = "High-performance bidirectional Nim-Python bridge supporting CPython Stable ABI (abi3/abi3t), CFFI, PEP 3118 zero-copy buffers, and lock-free asyncio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "cffi>=1.16.0",
    "headerkit",
]

[tool.uv.sources]
headerkit = { path = "/Users/eek/Development/headerkit", editable = true }

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "types-cffi>=1.16.0",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
mypy_path = ["python", "/Users/eek/Development/headerkit"]

[project.scripts]
naganim = "naganim._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/naganim"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python", "/Users/eek/Development/headerkit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ""
