[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "naganim"
version = "0.1.0"
description = "High-performance bidirectional Nim-Python bridge supporting CPython Stable ABI (abi3/abi3t), CFFI, PEP 3118 zero-copy buffers, and lock-free asyncio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Elijah R / Axiomantic" },
]
keywords = ["nim", "python", "ffi", "cffi", "bindings", "pep-3118", "freethreading", "nimony"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cffi>=1.16.0",
    "headerkit>=0.51.0",
]

[project.urls]
Homepage = "https://github.com/elijahr/naganim"
Repository = "https://github.com/elijahr/naganim"
Issues = "https://github.com/elijahr/naganim/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "types-cffi>=1.16.0",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
mypy_path = ["python"]

[project.scripts]
naganim = "naganim._cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["python/naganim"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ""
